[performance_email]

subject = Summary report of your computing jobs performance on XXX Cluster

body = """
<html>
<body style="font-family: sans-serif, Arial, Helvetica;">

<pre>

Dear {user}:

Here is the summary report of randomly selected
{reported_jobs} out of {total_jobs} total eligible GPU jobs
on the XXX Cluster.

{report}

</pre>

<p>
Among the metrics listed above, <b>CPUUsage</b> is useful for
checking job performance and efficiency.
</p>

<p>
<b>CPUUsage = CPUUser / CPUhours</b>
</p>

<p>
A CPUUsage value substantially below 1 may indicate that the
job requested more CPU resources than it actually used.
Possible causes include MPI configuration, requesting too many
CPUs or nodes, using whole-node resources unnecessarily,
oversubscription through multithreading, or heavy disk I/O.
</p>

<p>
<b>GPU efficiency:</b>
<span style="color:{color};">
{efficiency:.2f}%
</span>
</p>

<p>
Please review your job configuration if GPU utilization is low.
</p>

<p>
If you have any questions, please submit a ticket through
{support_url}.
</p>

<p>
Thanks!<br>
HPC Support
</p>

</body>
</html>
"""


[gpu_notification]

subject = Low GPU utilization detected for Slurm job {job_id}

body = """
Dear {user},

The GPU monitor detected low or imbalanced GPU utilization
for one of your running Slurm jobs on the XXX Cluster.

Job ID: {job_id}
Job name: {job_name}
Node: {node}
GPU(s): {gpu_text}
GPU count: {gpu_count}

Average GPU utilization: {average:.1f}%
Minimum GPU utilization: {minimum:.1f}%
Maximum GPU utilization: {maximum:.1f}%
Idle GPU count: {idle_count}

Please check your application's GPU utilization and job
resource request. Low GPU utilization may indicate that
the application is not using all allocated GPUs efficiently.

This message was generated automatically by the GPU job monitor.

Thanks,
HPC Support
"""


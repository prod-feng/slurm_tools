[cluster]

# Slurm command directory.
#
# Leave empty to use commands found in PATH:
#
#   sinfo
#   squeue
#   sacct
#   scontrol
#
# Example:
#
# slurm_bin_dir = /cm/shared/apps/slurm/current/bin

slurm_bin_dir =


[jobs]

# Default number of days covered by the job report.
default_days = 1

# Default Slurm state.
default_state = CD

# Default number of randomly selected jobs per user.
default_njobs = 10

# Jobs from these partitions will be ignored.
ignored_partitions = a100

# Set to true to include all Slurm states by default.
all_states = false


[nodes]

# Node utilization is calculated as:
#
#     node_load / node_cpu_count
#
# 0.10 = 10%
# 1.10 = 110%

low_utilization_threshold = 0.10
high_utilization_threshold = 1.10

# Do not generate a user alert for jobs running less than this
# number of seconds.
minimum_runtime = 3600

# Partitions to ignore.
ignored_partitions = shared,a100

# Job-name patterns to ignore.
#
# A job is ignored if any of these strings appears in its job name.
ignored_job_patterns = sys/dashboard

# Node states to consider for the performance report.
#
# Normally we are interested in allocated and mixed nodes.
included_states = alloc,mix


[email]

# Sender address.
sender = hpc_support@example.edu

# Optional comma-separated CC addresses.
cc =

# Optional comma-separated BCC addresses.
bcc =

# Used when a user's email address cannot be determined.
fallback_recipient = hpc_support@example.edu

# Job report subject.
job_subject = Summary report of your computing jobs performance on HPC Cluster

# Node alert subject.
#
# Available variables include:
#
#   {status}
#   {node}
#   {job_id}
#   {user}
#
node_subject = Your job {job_id} on node {node} needs attention: {status}

# Program used to send mail.
mail_command = mail


[templates]

job_report = job_report.html
node_alert = node_alert.html

